<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="contenedor">
      <section class="informacion">
        <h1 class="logo">facebook</h1>
        <p>
          Facebook te ayuda a comunicarte y compartir con las personas que
          forman parte de tu vida.
        </p>
      </section>

      <section class="seccion-formulario">
        <form class="formulario-inicio-sesion">
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Correo electrónico o número de teléfono"
            required
          />

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Contraseña"
            required
          />

          <button type="submit" class="btn-iniciar-sesion">
            Iniciar sesión
          </button>

          <a href="#" class="enlace-olvido">¿Has olvidado la contraseña?</a>

          <hr />

          <button type="button" class="btn-crear-cuenta">
            Crear cuenta nueva
          </button>
        </form>

        <p class="texto-crear-pagina">
          <strong>Crea una página</strong> para una celebridad, una marca o un
          negocio.
        </p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
